[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "storehelper"
version = "0.8.1"
description = "Local-first app store publishing for developers, CI/CD, and AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "StoreHelper Contributors" }]
keywords = ["app-store", "appgallery", "cli", "honor", "mobile", "oppo", "publishing", "vivo", "xiaomi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "cryptography>=45,<47",
  "httpx>=0.28,<1",
  "keyring>=25,<27",
  "platformdirs>=4,<5",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "twine>=6.1,<7",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
storehelper = "storehelper.cli:main"

[project.urls]
Homepage = "https://github.com/StoreHelper/storehelper"
Issues = "https://github.com/StoreHelper/storehelper/issues"
Source = "https://github.com/StoreHelper/storehelper"

[tool.hatch.build.targets.wheel]
sources = ["src"]
include = ["/src/storehelper/**/*.py"]

[tool.hatch.build]
dev-mode-dirs = ["src"]
# Do not rely on .gitignore; dirty working trees must be safe to package too.
exclude = [
  "**/.*",
  "**/__pycache__/**",
  "**/cache/**",
  "**/secrets/**",
  "**/local-artifacts/**",
  "**/local_artifacts/**",
  "**/build/**",
  "**/dist/**",
  "**/*.pyc",
]

[tool.hatch.build.targets.sdist]
include = [
  "/.gitignore",
  "/src/storehelper/**/*.py",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = false
source = ["storehelper"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["storehelper"]
mypy_path = "src"

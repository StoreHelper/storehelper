name: Release quality gates

on:
  workflow_call:
    inputs:
      release-tag:
        description: Exact v-prefixed tag; empty for non-release CI
        type: string
        default: ""
      testpypi-rehearsal:
        description: Require a unique development version before TestPyPI rehearsal
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Validate release tag
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python scripts/check_release.py --tag "$RELEASE_TAG"
      - name: Validate TestPyPI rehearsal version
        if: inputs.testpypi-rehearsal
        run: python scripts/check_release.py --testpypi-rehearsal
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: python -m pytest --cov=storehelper --cov-report=term-missing --cov-fail-under=90

  build:
    name: Build once and test the installed wheel
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6.1,<8'
      - name: Build wheel from the sdist
        run: python -m build
      - run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - run: python scripts/validate_dist.py --checksums
      - name: Test a fresh installed wheel, outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          VERSION=$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I "$GITHUB_WORKSPACE/scripts/smoke_installed.py" --version "$VERSION"
      - name: Upload the exact verified distributions and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

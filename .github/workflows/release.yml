name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/quality.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish-testpypi:
    name: Stage verified artifacts on TestPyPI
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/storehelper/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: bundle
      - name: Verify checksums and stage only distributions
        run: |
          (cd bundle && sha256sum --check SHA256SUMS)
          mkdir dist
          cp bundle/*.whl bundle/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: Promote the same artifacts to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/storehelper/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: bundle
      - name: Verify checksums and stage only distributions
        run: |
          (cd bundle && sha256sum --check SHA256SUMS)
          mkdir dist
          cp bundle/*.whl bundle/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

  github-release:
    name: Publish GitHub Release only after PyPI succeeds
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-distributions
          path: bundle
      - name: Verify and attach the same artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd bundle && sha256sum --check SHA256SUMS)
          flags=()
          if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$|\.dev[0-9]+$ ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${flags[@]}" bundle/*.whl bundle/*.tar.gz bundle/SHA256SUMS
